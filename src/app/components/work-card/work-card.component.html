<article class="work-card" [ngClass]="cardColor">
    <!-- Header with thumbnail -->
    <div class="card-header" *ngIf="thumbnail">
        <img
            [src]="thumbnail"
            [alt]="title + ' thumbnail'"
            class="card-thumbnail"
            (click)="openImageModal()"
            loading="lazy" />
        <div class="card-overlay">
            <span class="date-badge">
                <svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                {{ startDate }} — {{ endDate || 'Present' }}
            </span>
        </div>
    </div>

    <!-- Card Body -->
    <div class="card-body">
        <!-- Category Tags -->
        <div class="category-tags">
            <span 
                *ngFor="let cat of category" 
                class="tag"
                [ngClass]="{
                    'tag-project': cat === 'Projects',
                    'tag-qa': cat === 'QA',
                    'tag-fullstack': cat === 'Fullstack',
                    'tag-cert': cat === 'Certifications',
                    'tag-gamedev': cat === 'GameDev',
                    'tag-mobile': cat === 'Mobile'
                }">
                {{ cat }}
            </span>
        </div>

        <!-- Title -->
        <h3 class="card-title" [innerHTML]="title"></h3>

        <!-- Description -->
        <p class="card-description" [innerHTML]="description"></p>

        <!-- Highlights (Bullets) -->
        <div class="highlights">
            <div class="highlight-item" *ngFor="let bullet of bullets.slice(0, 4)">
                <span class="highlight-icon">→</span>
                <span [innerHTML]="bullet"></span>
            </div>
            <div class="highlight-item more" *ngIf="bullets.length > 4 && !readMoreOpen">
                <span class="highlight-icon">+</span>
                <span>{{ bullets.length - 4 }} more highlights...</span>
            </div>
        </div>

        <!-- Expanded Content -->
        <div class="expanded-content" *ngIf="readMoreOpen">
            <!-- Remaining bullets -->
            <div class="highlights">
                <div class="highlight-item" *ngFor="let bullet of bullets.slice(4)">
                    <span class="highlight-icon">→</span>
                    <span [innerHTML]="bullet"></span>
                </div>
            </div>
            <!-- Read more text -->
            <div *ngIf="readMoreText" [innerHTML]="readMoreText" class="read-more-content"></div>
        </div>
    </div>

    <!-- Card Footer -->
    <footer class="card-footer">
        <div class="footer-actions">
            <a *ngIf="link" [href]="link" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                View Project
            </a>
            <button *ngIf="readMoreText" class="btn btn-secondary" (click)="toggleReadMore()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.rotated]="readMoreOpen">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
                {{ readMoreOpen ? 'Show Less' : 'Read More' }}
            </button>
        </div>
    </footer>
</article>

<!-- Fullscreen Image Modal -->
<div class="image-modal" *ngIf="isModalOpen" (click)="closeImageModal()">
    <img [src]="thumbnail" [alt]="title" class="modal-image" />
    <button class="modal-close" (click)="closeImageModal()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>
